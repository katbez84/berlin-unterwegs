<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Berlin"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Berlin Unterwegs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#151c2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one full-screen map; station-display panels pinned to top and bottom edges. */
:root {
  --night: #151c2a;      /* app ground, panel base */
  --panel: #1c2537;
  --panel-2: #26314a;
  --rule: #364362;
  --text: #eef1f6;
  --muted: #a3aec2;
  --sign: #f3c22f;       /* BVG-yellow: the one loud color */
  --sign-ink: #1a1a14;
  --ubahn: #1f5fae;
  --sbahn: #3a8a3c;
  --warm: #e9764b;
  --good: #69c07a;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--text); font-family: var(--body); font-size: 15px; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--sign); outline-offset: 2px; }

#app { position: fixed; inset: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }

/* top bar */
#hud { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--night), color-mix(in srgb, var(--night) 82%, transparent)); }
.clock { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.day { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.wx { display: flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: var(--panel-2); font-size: 13px; white-space: nowrap; }
.wx canvas { width: 20px; height: 20px; }
.warmth { flex: 1; min-width: 70px; max-width: 160px; margin-left: auto; }
.warmth .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; }
.bar { height: 7px; border-radius: 4px; background: var(--panel-2); overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; width: 100%; background: var(--warm); transition: width .3s, background .3s; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--panel-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; }

/* floating map controls */
#ctrls { position: absolute; z-index: 4; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 70px); display: flex; flex-direction: column; gap: 8px; }
#ctrls .iconbtn { background: color-mix(in srgb, var(--panel) 92%, transparent); box-shadow: 0 2px 8px rgb(0 0 0 / .3); }

/* bottom sheet */
#sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 3px solid var(--sign);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  max-height: 58%; overflow-y: auto; touch-action: pan-y; box-shadow: 0 -6px 24px rgb(0 0 0 / .35); }
#sheet h2 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.05; margin: 0 0 4px; text-wrap: balance; letter-spacing: .01em; }
#sheet p { margin: 4px 0 10px; line-height: 1.45; max-width: 62ch; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--sign); font-weight: 600; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; cursor: pointer; background: var(--panel-2); min-height: 44px; }
.btn.primary { background: var(--sign); color: var(--sign-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--rule); }
.btn:disabled { opacity: .45; cursor: default; }
.goals { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 10px; }
.goal { display: flex; align-items: center; gap: 10px; }
.goal .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--rule); flex: none; display: grid; place-items: center; font-size: 13px; }
.goal.done .tick { background: var(--good); border-color: var(--good); color: #102010; }
.goal.done span { color: var(--muted); text-decoration: line-through; }
.compass { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.compass svg { width: 26px; height: 26px; transition: transform .2s; flex: none; }
.compass > span { min-width: 0; line-height: 1.2; }

/* line badges, station sign */
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 24px; padding: 0 6px; border-radius: 4px; color: #fff; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .02em; }
.badge.s { border-radius: 12px; }
.sign { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.1; }
.sym { display: inline-grid; place-items: center; width: 26px; height: 26px; color: #fff; font-family: var(--display); font-weight: 700; font-size: 20px; flex: none; }
.sym.u { background: var(--ubahn); border-radius: 4px; }
.sym.s { background: var(--sbahn); border-radius: 50%; }
.dirs { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 10px 0; }
.dir { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--rule); background: var(--panel-2); border-radius: 10px; padding: 9px 12px; cursor: pointer; min-height: 48px; }
.dir .to { font-family: var(--display); font-size: 19px; font-weight: 600; line-height: 1.1; }
.dir .to small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 400; }
.display { background: #0b0f17; border-radius: 8px; padding: 10px 12px; font-family: var(--display); color: #ffb648; margin: 8px 0 10px; }
.display .big { font-size: 26px; font-weight: 700; line-height: 1.1; }
.display .small { font-size: 14px; color: #c99a52; letter-spacing: .05em; text-transform: uppercase; }
.stops { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.stops b { color: var(--text); font-weight: 600; }

/* overlays (menu, lists) */
#overlay { position: absolute; inset: 0; z-index: 10; background: var(--night); overflow-y: auto; touch-action: pan-y;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 640px; margin: 0 auto; }
.ovhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.ovhead h1 { font-family: var(--display); font-size: 30px; margin: 0; }
.title-hero { padding: 26px 0 18px; }
.title-hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(46px, 13vw, 76px); line-height: .92; margin: 0; letter-spacing: -.005em; }
.title-hero h1 span { display: block; color: var(--sign); }
.title-hero p { color: var(--muted); max-width: 46ch; line-height: 1.5; margin: 12px 0 0; }
.tracks { height: 10px; margin: 18px 0 4px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.tracks i { border-radius: 2px; }
.menu { display: grid; gap: 10px; margin-top: 14px; }
.menu .btn { text-align: left; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font-size: 16px; }
.menu .btn small { color: var(--muted); font-weight: 400; font-size: 13px; }
.menu .btn.primary small { color: color-mix(in srgb, var(--sign-ink) 70%, transparent); }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--panel); border-radius: 12px; padding: 12px 14px; border: 0; text-align: left; cursor: pointer; width: 100%; }
.item h3 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.1; }
.item p { margin: 2px 0 0; font-size: 13px; color: var(--muted); line-height: 1.35; }
.item > div { min-width: 0; }
.num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; color: #fff; font-size: 15px; }
.stars { font-size: 17px; letter-spacing: 1px; color: var(--sign); white-space: nowrap; }
.stars .off { color: var(--rule); }
.sec { font-family: var(--display); font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 8px; }
.word { background: var(--panel); border-radius: 12px; padding: 12px 14px; }
.word b { font-family: var(--display); font-size: 21px; font-weight: 600; }
.word .en { color: var(--sign); margin-left: 6px; }
.word p { margin: 4px 0 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
.word.locked { opacity: .45; }
.small-print { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 22px; }

/* walking view: the map tilts back like a navigation app, sky above the horizon */
#sky { position: absolute; inset: 0; background: var(--night); display: none; }
#app.walk #sky { display: block; }
#app.walk #map { left: -35%; width: 170%; top: -55%; height: 155%; transform-origin: 50% 100%; transform: perspective(1400px) rotateX(42deg); }
.iconbtn.on { background: var(--sign) !important; }
.iconbtn.on svg { stroke: var(--sign-ink); }
#turn { position: absolute; z-index: 4; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 108px); max-width: calc(100% - 90px);
  display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--panel) 94%, transparent); border-radius: 10px; padding: 7px 12px 7px 8px; box-shadow: 0 2px 10px rgb(0 0 0 / .35); pointer-events: none; }
#turn svg { width: 30px; height: 30px; flex: none; transition: transform .2s; }
#turn b { display: block; font-family: var(--display); font-size: 20px; line-height: 1.05; }
#turn span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#turn div { min-width: 0; }
/* Berlin-style street-name plate shown while walking */
#streetsign { position: absolute; z-index: 4; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 70px);
  max-width: calc(100% - 90px); background: #fbfbf7; color: #111; font-family: var(--display); font-weight: 600; font-size: 19px; letter-spacing: .01em;
  padding: 3px 12px; border-radius: 4px; border: 2px solid #fbfbf7; box-shadow: inset 0 0 0 2px #111, 0 2px 8px rgb(0 0 0 / .35);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
/* toasts */
#toasts { position: absolute; z-index: 8; left: 50%; transform: translateX(-50%); bottom: 200px; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 420px); }
.toast { background: var(--sign); color: var(--sign-ink); border-radius: 10px; padding: 8px 14px; font-weight: 600; box-shadow: 0 4px 14px rgb(0 0 0 / .35); animation: tin .25s ease-out; text-align: center; }
.toast.word { background: var(--panel-2); color: var(--text); border: 1px solid var(--sign); }
.toast.word b { color: var(--sign); font-family: var(--display); font-size: 18px; }
@keyframes tin { from { transform: translateY(-8px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .bar i, .compass svg { transition: none; } }
</style>

<div id="app">
  <div id="sky"></div>
  <canvas id="map" aria-label="Map of central Berlin"></canvas>
  <header id="hud">
    <div><div class="clock" id="clock">15:10</div><div class="day" id="day">Sun 22 Nov</div></div>
    <div class="wx" id="wx" aria-label="Weather"><canvas id="wxicon" width="40" height="40"></canvas><span id="wxtext">5 °C</span></div>

    <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <div id="ctrls">
    <button class="iconbtn" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="iconbtn" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="iconbtn" id="walkview" aria-label="Walking view" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3l6 17-6-4-6 4z"/></svg></button>
    <button class="iconbtn" id="recenter" aria-label="Center on us"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>
  <div id="streetsign" hidden></div>
  <div id="turn" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <section id="sheet" aria-live="polite"></section>
  <section id="overlay" hidden></section>
</div>

function startMission(m) {

  S.visited = new Set(); S.paused = 0; S.hint = null; S.hintUsed = false; P.train = null; P.path = null;
  if (m.start.place) { const p = PL[m.start.place]; P.at = { kind: 'street', node: p.node }; P.x = p.x; P.y = p.y; S.visited.add(p.id); }
  else { const s = ST[m.start.station]; P.x = s.x; P.y = s.y; P.at = { kind: 'street', node: s.node }; P.x = NX[s.node]; P.y = NY[s.node]; }
  const plan = bestPlan(playerGraphNode(), m.goal); S.par = Math.max(4, plan.mins); S.started = S.min;
  V.x = P.x; V.y = P.y; V.s = 0.9; V.follow = true; labelsDirty = true;

  if (m.rain) learn('Nieselregen'); if (isDark()) learn('dunkel');
  m.words.slice(0, 2).forEach(learn);
  sheet(`<div class="eyebrow">${esc(DAYS[m.day].label)} · ${fmt(m.time)} · ${m.temp} °C${m.rain ? ', drizzle' : ''}</div><h2>${esc(m.title)}</h2><p>${esc(m.story)}</p>
    <p class="muted">Tap the map, a place or a station to walk there. Pinch or use + and − to zoom.</p>
    <div class="row"><button class="btn primary" id="go">Let’s go</button></div>`);
  document.getElementById('go').onclick = () => showMissionSheet();
  updateHud();
}
function startExplore() {
  hideStreetSign(); S.mode = 'play'; S.mission = null; S.day = 1; S.min = 10 * 60; S.temp = 4; S.rain = false; S.warmth = 100; S.visited = new Set(['H']); S.hint = null; S.done = false;
  const p = PL.H; P.at = { kind: 'street', node: p.node }; P.x = p.x; P.y = p.y; P.train = null; P.path = null;
  V.x = P.x; V.y = P.y; V.s = 0.7; labelsDirty = true; hideOverlay(); showMissionSheet(); updateHud();
}
function checkMission() {
  const m = S.mission; if (!m || S.done) return;
  if (!m.goal.every(g => S.visited.has(g))) { showMissionSheet(); return; }
  S.done = true; P.path = null; P.onArrive = null; const used = S.min - S.started - S.paused, ratio = used / S.par;
  let stars = ratio <= 1.2 ? 3 : ratio <= 1.7 ? 2 : 1; if (S.hintUsed) stars = Math.min(stars, 2);
  const prev = save.stars[m.id] || 0; if (stars > prev) { save.stars[m.id] = stars; persist(); }
  const start = m.start.place ? PL[m.start.place].node : stIndex[m.start.station] ;
  const plan = bestPlan(m.start.place ? start : ST[m.start.station].node, m.goal);
  const steps = plan.legs.flatMap(lg => describeLeg(lg).steps.concat([{ kind: 'arrive', p: lg.p }]));
  setTimeout(() => {
    P.path = null;
    sheet(`<div class="eyebrow">Mission complete</div><h2>${esc(m.title)}</h2>
    <div class="stars" style="font-size:28px">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3 - stars)}</span></div>
    <p>We took <b>${Math.round(used)} min</b>. The quickest way takes about <b>${Math.round(S.par)} min</b>.${S.hintUsed ? ' (We used the hint, so 2 stars at most.)' : ''}</p>
    <div class="eyebrow">The quickest way</div><ol style="margin:6px 0 12px;padding-left:20px;line-height:1.5">${steps.map(stepHtml).join('')}</ol>
    <div class="row"><button class="btn primary" id="nextM">Next mission</button><button class="btn ghost" id="again">Play again</button><button class="btn ghost" id="toMenu">Menu</button></div>`);
    learn('Ja / Nein'); const idx = MISSIONS.indexOf(m); document.getElementById('nextM').onclick = () => startMission(MISSIONS[(idx + 1) % MISSIONS.length]);
    document.getElementById('again').onclick = () => startMission(m); document.getElementById('toMenu').onclick = () => openMenu('missions');
  }, 700);
}
function stepHtml(s) {
  if (s.kind === 'walk') return `<li>Walk about ${Math.max(1, Math.round(s.mins))} min</li>`;
  if (s.kind === 'ride') return `<li><span class="badge ${s.line.kind === 'S' ? 's' : ''}" style="background:${s.line.color};height:20px;min-width:30px;font-size:15px">${s.line.ref}</span> from ${esc(s.from)}, Richtung ${esc(lineTerm(s.line, s.dir))}, ${s.stops} stop${s.stops > 1 ? 's' : ''} to <b>${esc(s.to)}</b></li>`;
  return `<li>Arrive: ${esc(s.p.name)}${s.p.scene ? ` (${s.p.scene.walk} min walk from the station)` : ''}</li>`;
}
function hintBtn() { return S.mission && !S.done ? '<button class="btn ghost" id="hintBtn">Show the quickest way</button>' : ''; }
function wireHint() { const b = document.getElementById('hintBtn'); if (!b) return; b.onclick = () => {
  const left = S.mission.goal.filter(g => !S.visited.has(g)); if (!left.length) return;
  const src = P.at.kind === 'station' || P.at.kind === 'offmap' ? stIndex[P.at.st] : (P.path ? P.path[Math.min(P.pathI + 1, P.path.length - 1)] : P.at.node);
  const plan = bestPlan(src, left); S.hintUsed = true; learn('Wo ist …?'); learn('Entschuldigung'); learn('Sprechen Sie Englisch?'); const ds = plan.legs.map(describeLeg); S.hint = ds.map(d => d.poly.map(([x, y]) => [x, y]));
  const steps = plan.legs.flatMap((lg, k) => ds[k].steps.concat([{ kind: 'arrive', p: lg.p }]));
  sheet(`<div class="eyebrow">Quickest way from here · about ${Math.round(plan.mins)} min</div><ol style="margin:6px 0 12px;padding-left:20px;line-height:1.5">${steps.map(stepHtml).join('')}</ol>
    <p class="muted">The dotted yellow line shows it on the map.</p><div class="row"><button class="btn primary" id="hintOk">Got it</button></div>`);
  document.getElementById('hintOk').onclick = () => (P.at.kind === 'station' || P.at.kind === 'offmap') ? stationSheet() : showMissionSheet(); }; }
function compassInner(g) {
  const d = DIST(P.x, P.y, g.x, g.y), ang = Math.atan2(g.x - P.x, -(g.y - P.y)) * 180 / Math.PI;
  const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'], dn = dirs[Math.round(((ang + 360) % 360) / 45) % 8];
  const DE = { N: 'Norden', NE: 'Nordosten', E: 'Osten', SE: 'Südosten', S: 'Süden', SW: 'Südwesten', W: 'Westen', NW: 'Nordwesten' };
  if (dn.includes('N')) learn('Norden'); if (dn.includes('S')) learn('Süden'); if (dn.includes('E')) learn('Osten'); if (dn.includes('W')) learn('Westen');
  const shown = ang + V.rot * 180 / Math.PI; // in walking view the arrow points the way to go on screen
  return `<svg viewBox="0 0 24 24" style="transform:rotate(${shown}deg)"><path d="M12 2l6 18-6-4-6 4z" fill="#f3c22f"/></svg><span>${d > 950 ? (d / 1000).toFixed(1) + ' km' : Math.round(d / 10) * 10 + ' m'} ${dn} <span class="muted" style="font-weight:500">(${DE[dn]})</span> to ${esc(g.name)}</span>`;
}
function showMissionSheet() {
  if (S.mode !== 'play' || P.train) return;
  if (P.at.kind === 'offmap') return stationSheet();
  const m = S.mission;
  if (!m) { const found = Object.keys(save.found).length;
    sheet(`<div class="eyebrow">Explore · ${found} of ${PLACES.length} places found</div><h2>Wander anywhere</h2>
      <p>Tap a numbered place to walk there, or a <span class="sym u" style="width:18px;height:18px;font-size:14px">U</span> or <span class="sym s" style="width:18px;height:18px;font-size:14px">S</span> station to ride a train.</p>
      <div class="row"><button class="btn ghost" id="toMenu">Menu</button></div>`);
    document.getElementById('toMenu').onclick = () => openMenu(); return; }
  if (S.done) return;
  const g = nextGoal();
  const comp = g ? `<div class="compass" id="compass">${compassInner(g)}</div>` : '';
  sheet(`<div class="eyebrow">${esc(m.title)}</div>
    <div class="goals">${m.goal.map(id => `<div class="goal ${S.visited.has(id) ? 'done' : ''}"><div class="tick">${S.visited.has(id) ? '✓' : ''}</div><span>${esc(PL[id].name)}</span></div>`).join('')}</div>
    ${comp}<div class="row" style="margin-top:10px">${P.path ? '<span class="muted">Walking…</span>' : ''}${hintBtn()}<button class="btn ghost" id="toMenu">Menu</button></div>`);
  wireHint(); document.getElementById('toMenu').onclick = () => openMenu('missions');
}

// ------------------------------------------------------------------ sheet + overlay
const sheetEl = document.getElementById('sheet'), ov = document.getElementById('overlay');
function sheet(html) { sheetEl.hidden = false; sheetEl.innerHTML = html; const box = document.getElementById('toasts'); if (box) box.style.bottom = (sheetEl.offsetHeight + 12) + 'px'; }
function hideSheet() { sheetEl.hidden = true; }
function hideOverlay() { ov.hidden = true; }
const fmt = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
function openMenu(tab) {
  ov.hidden = false; const done = Object.keys(save.stars).length, found = Object.keys(save.found).length, words = Object.keys(save.words).length;
  if (tab === 'missions') return missionsList();
  if (tab === 'places') return placesList();
  if (tab === 'words') return wordsList();
  ov.innerHTML = `<div class="wrap"><div class="title-hero"><h1>Berlin<span>Unterwegs</span></h1>
    <div class="tracks">${['#224F86', '#DA421E', '#7DAD4C', '#8C6DAB', '#EB7405', '#0066AD'].map(c => `<i style="background:${c}"></i>`).join('')}</div>
    <p><i>Unterwegs</i> means “out and about”. Practice finding our way around Berlin before the trip, on real streets and real train lines, in late-November weather.</p></div>
    <div class="menu">
      ${S.mode === 'play' ? '<button class="btn primary" id="resume">Back to the game <small>keep going</small></button>' : ''}
      <button class="btn ${S.mode === 'play' ? '' : 'primary'}" id="mMissions">Missions <small>${done} of ${MISSIONS.length} done</small></button>
      <button class="btn" id="mExplore">Explore freely <small>${found} of ${PLACES.length} places found</small></button>
      <button class="btn" id="mPlaces">Our places <small>Dad’s list, Andy’s, the hotel</small></button>
      <button class="btn" id="mWords">German words <small>${words} of ${Object.keys(WORDS).length} learned</small></button>
      <button class="btn" id="mReal">We’re in Berlin <small>show where we really are</small></button>
    </div>
    <p class="small-print">Map data © OpenStreetMap contributors (ODbL), downloaded 15 Nov 2026. Train lines and stops are real; times are estimates. Christmas market dates and hours are typical and change each year, so check before going. Progress is saved on this phone only.</p>
    ${(window.__offlineReady || (navigator.serviceWorker && navigator.serviceWorker.controller)) ? '<p class="small-print" style="color:var(--good);margin-top:6px">✓ Saved on this phone. The game works without internet.</p>' : ''}
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="mReset">Reset progress</button></div></div>`;
  const on = (id, f) => { const b = document.getElementById(id); if (b) b.onclick = f; };
  on('resume', () => { hideOverlay(); }); on('mMissions', missionsList); on('mExplore', startExplore); on('mPlaces', placesList); on('mWords', wordsList); on('mReal', startReal);
  on('mReset', () => { const b = document.getElementById('mReset'); if (b.dataset.sure) { save = { stars: {}, found: {}, words: {} }; persist(); openMenu(); } else { b.dataset.sure = '1'; b.textContent = 'Tap again to erase stars, places and words'; } });
}
function ovHead(title) { return `<div class="ovhead"><h1>${title}</h1><button class="btn ghost" id="back">Back</button></div>`; }
function missionsList() {
  ov.hidden = false;
  ov.innerHTML = `<div class="wrap">${ovHead('Missions')}<div class="list">${MISSIONS.map((m, i) => { const st = save.stars[m.id] || 0;
    return `<button class="item" data-i="${i}"><div class="num" style="background:var(--panel-2)">${i + 1}</div><div><h3>${esc(m.title)}</h3><p>${esc(DAYS[m.day].label)} · ${fmt(m.time)} · ${m.temp} °C${m.rain ? ', drizzle' : ''}${isNightAt(m) ? ', dark' : ''}</p></div>
    <div class="stars">${'★'.repeat(st)}<span class="off">${'★'.repeat(3 - st)}</span></div></button>`; }).join('')}</div></div>`;
  document.getElementById('back').onclick = () => openMenu();
  ov.querySelectorAll('.item').forEach(b => b.onclick = () => startMission(MISSIONS[+b.dataset.i]));
}
function isNightAt(m) { const d = DAYS[m.day]; return m.time > d.set + 10; }
function placesList() {
  ov.hidden = false; const groups = [['Our spots', ['home', 'friend', 'film']], ['Sights', ['sight']], ['Museums', ['museum']], ['Christmas and winter markets', ['market']]];
  ov.innerHTML = `<div class="wrap">${ovHead('Our places')}${groups.map(([t, cats]) => `<div class="sec">${t}</div><div class="list">${PLACES.filter(p => cats.includes(p.cat)).map(p =>
    `<button class="item" data-id="${p.id}"><div class="num" style="background:${CATCOLOR[p.cat]}">${esc(p.id)}</div><div><h3>${esc(p.name)}</h3><p>${esc(p.look)}</p></div><div class="stars">${save.found[p.id] ? '✓' : ''}</div></button>`).join('')}</div>`).join('')}</div>`;
  document.getElementById('back').onclick = () => openMenu();
  ov.querySelectorAll('.item').forEach(b => b.onclick = () => { const p = PL[b.dataset.id]; hideOverlay(); V.x = p.x; V.y = p.y; V.s = p.onMap ? 1.1 : 0.06; V.follow = false; labelsDirty = true; showPlaceCard(p, false); draw(); });
}
function wordsList() {
  ov.hidden = false;
  const all = Object.entries(WORDS), got = all.filter(([w]) => save.words[w]).length;
  ov.innerHTML = `<div class="wrap">${ovHead('German words')}<p class="muted">${got} of ${all.length} found. Words unlock as they come up: on street signs, on the train, at places and markets, and in the weather.</p>
    ${WORD_TOPICS.map((t, ti) => { const ws = all.filter(([, v]) => v[2] === ti), n = ws.filter(([w]) => save.words[w]).length;
      return `<div class="sec">${t} · ${n}/${ws.length}</div><div class="list">${ws.map(([w, [en, tip]]) => save.words[w]
        ? `<div class="word"><b>${esc(w)}</b><span class="en">${esc(en)}</span><p>${esc(tip)}</p></div>` : `<div class="word locked"><b>• • •</b><p>Not found yet</p></div>`).join('')}</div>`; }).join('')}</div>`;
  document.getElementById('back').onclick = () => openMenu();

// ------------------------------------------------------------------ real mode (GPS)
function startReal() {
  hideOverlay(); S.mode = 'real'; S.real = { pos: null, acc: 0, watch: null, err: null }; S.min = new Date().getHours() * 60 + new Date().getMinutes();
  V.x = PL.H.x; V.y = PL.H.y; V.s = 0.6; labelsDirty = true;
  if (!('geolocation' in navigator)) { S.real.err = 'This phone or browser can’t share its location.'; realSheet(); return; }
  try {
    S.real.watch = navigator.geolocation.watchPosition(p => { const [x, y] = proj(p.coords.latitude, p.coords.longitude); const first = !S.real.pos;
      if (S.real.pos && DIST(x, y, S.real.pos[0], S.real.pos[1]) > 6) S.real.heading = Math.atan2(y - S.real.pos[1], x - S.real.pos[0]); S.real.pos = [x, y]; S.real.acc = p.coords.accuracy || 30; S.real.err = null;
      if (first || V.follow) { V.x = x; V.y = y; if (first) { V.s = 1; V.follow = true; } labelsDirty = true; } realSheet(); },
      e => { S.real.err = e.code === 1 ? 'Location is turned off for this game. Allow location for it in your phone’s settings, then try again.' : 'We can’t find our location right now. Try outside, away from tall buildings.'; realSheet(); },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  } catch (e) { S.real.err = 'Location doesn’t work in this preview. It works in the installed version on your phone.'; }
  realSheet();
}
function realSheet() {
  const R = S.real; let body;
  if (R.err) body = `<p>${esc(R.err)}</p>`;
  else if (!R.pos) body = '<p>Finding where we are…</p>';
  else { const [x, y] = R.pos; const nearP = PLACES.filter(p => p.onMap || true).map(p => [p, DIST(x, y, p.x, p.y)]).sort((a, b) => a[1] - b[1]).slice(0, 3);
    const nearS = Object.values(ST).map(s => [s, DIST(x, y, s.x, s.y)]).sort((a, b) => a[1] - b[1])[0];
    const out = !inMap(x, y) ? '<p class="muted">We’re outside the street map, so only train lines are drawn here.</p>' : '';
    body = `${out}<p>Nearest station: <b>${esc(nearS[0].name)}</b> (${stKinds(nearS[0]).join(' and ')}), about ${Math.round(nearS[1] / WALK)} min on foot.</p>
      <div class="goals">${nearP.map(([p, d]) => `<div class="goal"><div class="num" style="background:${CATCOLOR[p.cat]};width:24px;height:24px;font-size:13px">${esc(p.id)}</div><span>${esc(p.name)} · ${d > 950 ? (d / 1000).toFixed(1) + ' km' : Math.round(d / 10) * 10 + ' m'}</span></div>`).join('')}</div>`; }
  sheet(`<div class="eyebrow">We’re in Berlin · real location</div>${body}<div class="row"><button class="btn ghost" id="realStop">Back to the game menu</button></div>`);
  document.getElementById('realStop').onclick = () => { if (R.watch != null) navigator.geolocation.clearWatch(R.watch); S.real = null; S.mode = 'title'; openMenu(); };
}

// ------------------------------------------------------------------ HUD + loop
const $ = id => document.getElementById(id);
const wxc = $('wxicon').getContext('2d');
let hudKey = '', skyKey = '';
function updateSky() { if (!V.walk) return; const dk = Math.round(darkness() * 20) / 20, k = dk + '' + S.rain; if (k === skyKey) return; skyKey = k;
  document.getElementById('sky').style.background = `linear-gradient(${mix([150, 165, 182], [8, 12, 24], dk)}, ${mix([205, 211, 218], [40, 46, 66], dk)})`; }
function updateHud() {
  const temp = Math.round(S.temp - (isDark() ? 1 : 0));
  const key = [fmt(S.min), S.day, temp, S.rain, Math.round(S.warmth), isDark()].join();
  if (key === hudKey) return; hudKey = key;
  $('clock').textContent = fmt(S.min); $('day').textContent = (DAYS[S.day] || DAYS[1]).label;
  $('wxtext').textContent = `${temp} °C${S.rain ? ' · drizzle' : ''}`;
  $('warmtxt').textContent = Math.round(S.warmth); const wb = $('warmbar'); wb.style.width = S.warmth + '%'; wb.style.background = S.warmth < 30 ? '#6aa9e8' : S.warmth < 60 ? '#e9b24b' : '#e9764b';
  wxc.clearRect(0, 0, 40, 40); // cloud, moon or sun, rain
  if (isDark()) { wxc.fillStyle = '#e8e3c8'; wxc.beginPath(); wxc.arc(26, 13, 8, 0, 7); wxc.fill(); wxc.fillStyle = '#26314a'; wxc.beginPath(); wxc.arc(30, 10, 7, 0, 7); wxc.fill(); }
  wxc.fillStyle = '#c9d2e0'; wxc.beginPath(); wxc.arc(14, 22, 8, 0, 7); wxc.arc(23, 19, 9, 0, 7); wxc.arc(30, 24, 6, 0, 7); wxc.rect(8, 22, 26, 8); wxc.fill();
  if (S.rain) { wxc.strokeStyle = '#7fb1e6'; wxc.lineWidth = 2.5; wxc.beginPath(); [12, 20, 28].forEach(x => { wxc.moveTo(x, 33); wxc.lineTo(x - 2, 38); }); wxc.stroke(); }
}
let last = performance.now(), settleT = 0, walkLayoutT = 0, turnT = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let moving = false;
  if (S.mode === "play" && ov.hidden) {
    if (P.path) { stepWalk(dt); moving = true; }
    if (P.train) { stepTrain(dt); moving = true; }
  }
  if (V.walk) {
    let tx = P.x, ty = P.y, head = null;
    if (S.mode === 'real' && S.real && S.real.pos) { [tx, ty] = S.real.pos; head = S.real.heading ?? null; }
    else if (P.train) { const l = P.train.line, a = ST[l.stops[P.train.i]], b = ST[l.stops[P.train.i + P.train.dir]] || a; if (b !== a) head = Math.atan2(b.y - a.y, b.x - a.x); }
    else if (P.path && P.path[P.pathI + 1] !== undefined) { const n = P.path[P.pathI + 1]; if (DIST(P.x, P.y, NX[n], NY[n]) > 0.5) head = Math.atan2(NY[n] - P.y, NX[n] - P.x); }
    if (head !== null) V.head = head;
    if (V.follow) { V.x += (tx - V.x) * 0.25; V.y += (ty - V.y) * 0.25; }
    const want = -Math.PI / 2 - (V.head ?? -Math.PI / 2) + V.look; let dr = want - V.rot; while (dr > Math.PI) dr -= 2 * Math.PI; while (dr < -Math.PI) dr += 2 * Math.PI;
    V.rot += dr * Math.min(1, dt * 4); if (Math.abs(dr) > 0.002 || moving) { walkLayoutT -= dt; if (walkLayoutT <= 0) { labelsDirty = true; walkLayoutT = 0.3; } }
  }
  turnT -= dt; if (turnT <= 0) { turnT = 0.25; updateTurn(); }
  if (moving && V.follow && !V.walk) { const [sx, sy] = toScreen(P.x, P.y); const mx = W * 0.25, my = H * 0.22;
    if (sx < mx || sx > W - mx || sy < my + 60 || sy > H - my - sheetEl.offsetHeight * 0.6) { V.x += (P.x - V.x) * 0.08; V.y += (P.y - V.y) * 0.08; settleT = 0.15; } }
  if (settleT > 0) { settleT -= dt; if (settleT <= 0) labelsDirty = true; }
  if (S.rain && !reduceMotion) for (const d of drops) { d.y += d.v * dt * 1.3; d.x -= d.v * dt * 0.25; if (d.y > 1) { d.y = 0; d.x = Math.random() * 1.1; } }
  updateHud(); updateSky();
  draw();
  requestAnimationFrame(loop);
}

// ------------------------------------------------------------------ boot
window.addEventListener('resize', resize);
resize();
V.x = PL.H.x; V.y = PL.H.y - 300; V.s = 0.16; S.day = 1; S.min = 16 * 60 + 40;
openMenu(); hideSheet();
try { if (localStorage.getItem('berlin-walkview') === '1') setWalkView(true); } catch (e) {}
window.addEventListener('offline-ready', () => { if (!ov.hidden && ov.querySelector('.title-hero')) openMenu(); });
requestAnimationFrame(loop);
window.__game = { S, P, V, PL, ST, LINES, bestPlan, describeLeg, startMission, MISSIONS };
})();

</script>
